# Present this Pi to a phone as a Bluetooth HEADSET (HFP HF / HSP HS role), so the
# phone uses the Pi's "microphone" (the HFP SCO uplink) during calls / VoIP. We
# inject the Convbased converted audio into that uplink (see convbased-link / linker.py).
#
# Install to: ~/.config/wireplumber/wireplumber.conf.d/51-convbased-bluez.conf
# then:       systemctl --user restart wireplumber
#
# Verified on: Debian 13 (trixie) aarch64, PipeWire 1.4.2, WirePlumber 0.5.8, BlueZ 5.82.

monitor.bluez.properties = {
  bluez5.enable-sbc-xq    = true
  bluez5.enable-hw-volume = true
  bluez5.hfphsp-backend   = "native"

  # CVSD (narrowband, 8 kHz) only -- mSBC (wideband) uplink TX did NOT work in
  # testing. With an Android Audio Gateway the SCO link negotiated Transparent/mSBC
  # and the host sent 0 SCO TX packets (vs 1946 RX) -> the far end heard nothing,
  # while an iOS AG (which used CVSD) worked end-to-end. So we force CVSD for
  # cross-platform reliability. Set this back to true to retry wideband.
  bluez5.enable-msbc = false

  # Headset-side roles only: the phone connects to us as the Audio Gateway and we
  # are the Hands-Free unit. Dropping a2dp_source / hfp_ag / hsp_ag stops us from
  # advertising the "phone" side, so phones treat us cleanly as a headset (this is
  # exactly the role combo real headphones expose: A2DP sink + HFP/HSP HF).
  bluez5.roles = [ a2dp_sink hfp_hf hsp_hs ]
}
