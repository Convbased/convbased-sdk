# A persistent null sink "convbased_out". The Convbased app (or a test tone) writes
# audio here; convbased-link (linker.py) wires its monitor into the transient
# Bluetooth HFP uplink node whenever a call is active.
#
# Install to: ~/.config/pipewire/pipewire.conf.d/51-convbased-out.conf
# then:       systemctl --user restart pipewire

context.objects = [
  { factory = adapter
    args = {
      factory.name    = support.null-audio-sink
      node.name       = convbased_out
      node.description = "Convbased Out"
      media.class     = "Audio/Sink"
      # HFP uplink is mono. PipeWire downmixes any future stereo converted track here.
      audio.position  = [ MONO ]
      object.linger   = true
    }
  }
]
