# Optional. Disable eSCO so the SCO link falls back to basic SCO (HV3).
#
# NOTE: this turned out NOT to be the fix for the Pi-4 onboard uplink. On the
# incoming-accept path (the phone is the HFP Audio Gateway and initiates the SCO; the
# Pi accepts) the kernel still negotiates eSCO regardless of this flag, and the uplink
# works fine over eSCO *once SCO-over-HCI routing is set* (see convbased-btclass /
# convbased-scoroute). It's kept here as a harmless belt-and-suspenders / documentation
# of what was tried. The routing vendor command is the thing that actually matters.
#
# Install to /etc/modprobe.d/ ; takes effect on the next boot (or module reload).
options bluetooth disable_esco=1
